<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quality Rush: Line Down!</title>
<meta name="description" content="Keep the line running as Mike Maintenance. Lock out, pick the right tool and fix machines before they break down. A 2½-minute maintenance arcade game.">
<meta name="theme-color" content="#060f1c">
<meta property="og:title" content="Quality Rush: Line Down!">
<meta property="og:description" content="Lock out, pick the right tool, keep the line running. A maintenance arcade game.">
<meta property="og:image" content="assets/logo.webp">
<link rel="icon" href="assets/face_confident.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<section class="screen scroll" id="title"></section>
<section class="screen" id="play" hidden>
  <div class="hud">
    <div class="tile"><div class="k">Score</div><div class="v" id="hScore">0</div></div>
    <div class="tile"><div class="k">Uptime</div><div class="v good" id="hUp">100%</div></div>
    <div class="tile"><div class="k">Shift</div><div class="v" id="hTime">2:30</div></div>
    <div class="tile"><div class="k">Down</div><div class="marks" id="hDown"></div></div>
    <div class="tile"><div class="k">Safety</div><div class="marks" id="hSafe"></div></div>
    <button class="iconbtn" id="sndBtn" aria-label="Mute sound"></button>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div class="rotate">⟳ Turn your phone sideways for a bigger floor</div>
  <div class="stagebox" id="stagebox"><div class="stage" id="stage">
    <canvas id="cv" aria-label="Line Down game floor. Tap a machine to send Mike to it, tap the floor to move, swipe up or press Jump to hop oil spills."></canvas>
    <div class="overlay" id="ov"></div>
    <button class="jbtn" id="bJump" aria-label="Jump">JUMP</button>
    <div class="rp" id="rp" hidden></div>
  </div></div>
  <div class="callout mcall"><div class="face" id="mFace"></div><div class="bubble" id="mSay">Keep it running.</div></div>
  <div class="keys"><b>Click</b> a machine · <kbd>←</kbd><kbd>→</kbd> move · <kbd>Space</kbd> jump / repair · <kbd>L</kbd> lockout · <kbd>1</kbd>–<kbd>4</kbd> tools · <kbd>P</kbd> pause</div>
</section>
<section class="screen scroll" id="end" hidden></section>
<noscript><p style="padding:24px;color:#fff">Line Down! needs JavaScript to run.</p></noscript>
<script src="js/game.js"></script>
</body>
</html>
